server:
  port: ${AGRIMIND_SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AGRIMIND_DB_URL:jdbc:mysql://localhost:3306/agrimind?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AGRIMIND_DB_USERNAME:root}
    password: ${AGRIMIND_DB_PASSWORD:}
  data:
    redis:
      host: ${AGRIMIND_REDIS_HOST:localhost}
      port: ${AGRIMIND_REDIS_PORT:6379}
      password: ${AGRIMIND_REDIS_PASSWORD:}
      database: ${AGRIMIND_REDIS_DATABASE:0}
